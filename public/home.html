<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <script src="js/utils.js" defer></script>
</head>

<body>
  <div class="home-container">
    <div id="sidebar-container"></div>

    <main class="content" id="main-content" role="main">
      <!-- Breadcrumb e User Profile na mesma linha -->
      <div
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl);">
        <nav class="breadcrumb" aria-label="Breadcrumb" style="margin: 0;">
          <a href="home.html">Home</a>
          <span class="breadcrumb-separator">/</span>
          <span>Dashboard</span>
        </nav>
        <div class="user-profile-menu">
          <button class="user-avatar-button" id="user-menu-button" aria-label="Abrir menu do usuário">JO</button>
          <div class="dropdown-menu hidden" id="user-dropdown">
            <div class="dropdown-header">
              <p class="user-name">João Silva</p>
              <p class="user-email">coordenacao@uea.edu.br</p>
              <p class="user-score"><strong>Coordenador</strong></p>
            </div>
            <ul>
              <li><a href="meuperfil.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg> Meu Perfil</a></li>
              <li><a href="configuracoes.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12.22 2h-4.44a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.88z"></path>
                    <path d="M18 2h-2.17a2 2 0 0 0-1.41.59L12 5l-2.41-2.41A2 2 0 0 0 8.17 2H6"></path>
                    <path d="M9.5 2a2.83 2.83 0 0 1 5 0"></path>
                  </svg> Configurações</a></li>
              <li><a href="#" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" x2="9" y1="12" y2="12"></line>
                  </svg> Sair</a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="dashboard-header" id="dashboard-header">
        <div>
          <h2 style="opacity: 0;"><!-- Carregando... --></h2>
          <p class="dashboard-subtitle" style="opacity: 0;"><!-- Carregando... --></p>
        </div>
      </div>

      <div class="metrics-grid">
        <article class="metric-card-modern kpi-card">
          <div class="metric-card-header">
            <h3>Alunos Ativos</h3>
          </div>
          <div class="metric-card-content">
            <div class="metric-value">
              <span class="value-number" id="totalAlunosNumero">0</span>
              <span class="value-label" id="totalAlunosLegenda">alunos cadastrados</span>
            </div>
          </div>
        </article>

        <article class="metric-card-modern kpi-card">
          <div class="metric-card-header">
            <h3>Simulados aplicados</h3>
          </div>
          <div class="metric-card-content">
            <div class="metric-value">
              <span class="value-number" id="totalSimuladosNumero">--</span>
              <span class="value-label">simulados aplicados</span>
            </div>
          </div>
        </article>

        <article class="metric-card-modern kpi-card">
          <div class="metric-card-header">
            <h3>Aproveitamento médio</h3>
          </div>
          <div class="metric-card-content">
            <div class="metric-value">
              <span class="value-number" id="aproveitamentoMedioNumero">--</span>
              <span class="value-label">média geral da turma</span>
            </div>
          </div>
        </article>

        <article class="metric-card-modern analysis-card full-width">
          <div class="analysis-card-header">
            <div>
              <h3>Análises</h3>
              <p class="analysis-subtitle" id="analysisSubtitle">Média de acertos ao longo do tempo</p>
            </div>

            <div class="analysis-tabs" role="tablist" aria-label="Análises de desempenho">
              <button
                type="button"
                class="analysis-tab is-active"
                id="progressTab"
                role="tab"
                aria-selected="true"
                aria-controls="progressPanel"
                tabindex="0"
                data-analysis-tab="progress"
              >Progresso mensal</button>
              <button
                type="button"
                class="analysis-tab"
                id="retentionTab"
                role="tab"
                aria-selected="false"
                aria-controls="retentionPanel"
                tabindex="-1"
                data-analysis-tab="retention"
              >Retenção por disciplina</button>
            </div>
          </div>

          <div class="analysis-panels">
            <section class="analysis-panel is-active" id="progressPanel" role="tabpanel" aria-labelledby="progressTab">
              <div class="metric-card-content analysis-content analysis-content-progress">
                <canvas id="progressChart" role="img"
                  aria-label="Gráfico de progresso mensal mostrando a média de acertos ao longo do tempo"></canvas>
              </div>
            </section>

            <section class="analysis-panel" id="retentionPanel" role="tabpanel" aria-labelledby="retentionTab" hidden>
              <div class="metric-card-content analysis-content analysis-content-tall">
                <canvas id="retencaoChart" role="img" aria-label="Gráfico de retenção por disciplina mostrando taxa de erro"></canvas>
              </div>
            </section>
          </div>
        </article>
      </div>
    </main>
  </div>

  <script src="js/home.js"></script>

</body>

</html>
